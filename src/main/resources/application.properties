# Configurações de Conexão com o Banco MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/loja_virtual?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate: Cria/atualiza as tabelas automaticamente com base no código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true