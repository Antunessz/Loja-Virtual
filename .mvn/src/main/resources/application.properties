# Conexão com o MySQL. Os valores abaixo podem ser sobrescritos por variáveis de ambiente
# (DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET), assim nenhuma senha precisa ficar no GitHub.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loja_virtual?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Chave do JWT (mínimo 32 caracteres). Em produção, defina JWT_SECRET no ambiente.
app.jwt.secret=${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}

# Hibernate: cria/atualiza as tabelas com base nas entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
